<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Neon Rain</title>
<meta name="description" content="Neon Rain, scenes 1 and 2: a pixel-art noir point-and-click set in Tokyo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: one column. The alley (a 224x126 view of 180-high art, scaled up) is the page; HUD and dialogue sit on it like a game screen. Designer notes below. */
:root {
  --bg: #0b0a1c; --panel: #14132d; --panel-2: #1c1a3d; --line: #2e2b5a;
  --fg: #ece9ff; --muted: #a39ecf; --neon: #ff5cb6; --clue: #7fe7dc; --yen: #f3c85e;
  --lcd: #a5b78d; --lcd-ink: #1d2919; --lcd-edge: #4c5841;
  --thought: #c8c0ff; --mercer: #e0b97f; --tetsu: #f4f4ff; --guide: #b9dc8c;
  --t-obvious: #7ad38b; --t-subtle: #f3c85e; --t-secret: #ff5cb6; --t-empty: #8b87b4;
  --f-pixel: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-lcd: 'VT323', ui-monospace, 'Courier New', monospace;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--f-pixel); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--neon); }
h1 { font-family: var(--f-pixel); font-weight: 600; font-size: clamp(26px, 5vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.rotate { display: none; font-size: 14px; color: var(--muted); margin: 0; }
@media (max-width: 640px) and (orientation: portrait) { .rotate { display: block; } }
@media (max-width: 640px) { .wrap { gap: 14px; padding-block: 14px 48px; } .lede { font-size: 15px; } .eyebrow { font-size: 11px; } }
@media (orientation: landscape) and (max-height: 560px) {
  header { display: none; }
  .wrap { padding-block: 8px 40px; gap: 12px; }
}
@media (hover: none) { .keys { display: none; } }

/* ---------- stage */
.stage { position: relative; container-type: inline-size; background: #000; border-radius: 4px; overflow: hidden;
  width: 100%; max-width: calc((100dvh - 16px) * 16 / 9); margin-inline: auto;
  box-shadow: 0 0 0 1px var(--line), 0 18px 50px rgba(0, 0, 0, .55); }
#screen { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 1cqw; padding: 1.5cqw 1.8cqw; pointer-events: none; }
.hud-r { display: flex; gap: .8cqw; align-items: stretch; flex-wrap: wrap; justify-content: flex-end; }
.lcd { font-family: var(--f-lcd); font-size: clamp(15px, 3.6cqw, 32px); line-height: .9; background: var(--lcd); color: var(--lcd-ink);
  padding: .16em .4em .06em; border: 2px solid var(--lcd-edge); box-shadow: inset 0 0 0 1px #c6d4ae, 0 0 0 2px rgba(0, 0, 0, .5); font-variant-numeric: tabular-nums; }
.lcd small { display: block; font-size: .5em; letter-spacing: .12em; opacity: .75; }
.chip { font-family: var(--f-pixel); font-size: clamp(10px, 2.15cqw, 18px); line-height: 1; display: flex; align-items: center; gap: .45em;
  background: rgba(8, 8, 22, .74); border: 1px solid var(--line); padding: .45em .6em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { font-weight: 600; }
.chip .k { color: var(--muted); font-size: .78em; letter-spacing: .08em; }
.chip.clues b { color: var(--clue); }
.chip.yen b { color: var(--yen); }
.pop { position: absolute; font-family: var(--f-pixel); font-size: clamp(11px, 2.3cqw, 19px); pointer-events: none; text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, .8); animation: rise 1.4s ease-out forwards; white-space: nowrap; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(-2.4em); opacity: 0; } }

/* ---------- hold-to-walk arrows, bottom corners of the screen */
.walk { position: absolute; bottom: 2.4cqw; width: clamp(40px, 9cqw, 72px); aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(216, 211, 255, .55);
  background: rgba(9, 8, 24, .55); display: grid; place-items: center; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; padding: 0; }
.walk-l { left: 2.4cqw; } .walk-r { right: 2.4cqw; }
.walk span { width: 0; height: 0; border-block: clamp(7px, 1.6cqw, 13px) solid transparent; }
.walk-l span { border-right: clamp(10px, 2.3cqw, 18px) solid var(--fg); margin-right: .2em; }
.walk-r span { border-left: clamp(10px, 2.3cqw, 18px) solid var(--fg); margin-left: .2em; }
.walk.on { border-color: var(--neon); background: rgba(58, 31, 64, .7); }
.walk:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
.stage.busy .walk { opacity: .25; pointer-events: none; }
@media (max-width: 640px) {
  .pad { display: flex; justify-content: space-between; padding: 8px 14px 0; background: rgba(9, 8, 24, .95); }
  .walk { position: static; width: 52px; }
}

/* ---------- dialogue box: on the screen when wide, under it when narrow */
.dialog { position: absolute; left: 2cqw; right: 2cqw; top: 10.5cqw; background: rgba(9, 8, 24, .94); border: 2px solid #d8d3ff;
  box-shadow: 0 0 0 2px #0b0a1c, 0 8px 24px rgba(0, 0, 0, .6); padding: 1.5cqw 2cqw 1.7cqw; font-family: var(--f-pixel);
  font-size: clamp(13px, 2.45cqw, 21px); line-height: 1.35; display: grid; gap: .45em; align-content: start; cursor: pointer; }
.dialog.idle { display: none; }
.who { font-size: .78em; letter-spacing: .1em; text-transform: uppercase; }
.dhead { display: flex; justify-content: space-between; align-items: center; gap: .8em; }
.gain { font-size: .78em; letter-spacing: .06em; padding: .12em .55em; border: 1px solid currentColor; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gain.clue { color: var(--clue); } .gain.yen { color: var(--yen); }
.gain.none { color: var(--muted); border-color: var(--line); }
.who.mercer { color: var(--mercer); } .who.tetsu { color: var(--tetsu); } .who.sys { color: var(--neon); } .who.guide { color: var(--guide); }
.who .sub { color: var(--muted); letter-spacing: .04em; text-transform: none; margin-left: .5em; }
.line { min-height: 2.7em; text-wrap: pretty; }
.line.thought { color: var(--thought); }
.line.act { color: var(--muted); }
.line.sys { color: #d6d2f2; }
.line.guide { color: var(--guide); }
.more { justify-self: end; color: var(--neon); font-size: .7em; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.opts { display: flex; flex-wrap: wrap; gap: .5em; }
.opt { font: inherit; font-size: .9em; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); padding: .35em .7em; cursor: pointer; display: inline-flex; gap: .5em; align-items: baseline; }
.opt:focus-visible { border-color: var(--neon); outline: none; color: #fff; }
@media (hover: hover) { .opt:hover { border-color: var(--neon); color: #fff; } }
.opt .cost { color: var(--neon); font-size: .72em; letter-spacing: .06em; }
.opt .seen { color: var(--muted); font-size: .72em; }
.opts.lines { flex-direction: column; align-items: stretch; gap: .4em; }
.opts.lines .opt { text-align: left; font-size: .86em; line-height: 1.3; padding: .4em .7em; }
@media (max-width: 640px) {
  .dialog { position: static; border-width: 2px 0 0; box-shadow: none; font-size: 15px; min-height: 108px; padding: 12px 14px 14px; }
  .dialog.idle { display: grid; }
}

/* ---------- end card */
.endcard { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6, 6, 16, .74); padding: 3cqw; overflow: auto; }
.card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 0 3px #0b0a1c, 0 0 0 4px var(--neon); padding: 18px 20px; display: grid; gap: 12px; }
.card h2 { font-family: var(--f-pixel); font-weight: 600; font-size: clamp(18px, 3.4cqw, 26px); margin: 0; }
.card .when { font-family: var(--f-lcd); font-size: 22px; color: var(--lcd); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--panel-2); padding: 8px 10px; display: grid; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.stat .v { font-family: var(--f-pixel); font-size: 22px; font-variant-numeric: tabular-nums; }
.gate { font-size: 14px; display: grid; gap: 4px; }
.gate .state { font-family: var(--f-pixel); font-size: 15px; }
.gate .state.on { color: var(--t-obvious); } .gate .state.off { color: var(--muted); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.check { font-size: 13px; padding: 2px 8px; border: 1px solid var(--line); color: var(--muted); }
.check.on { color: var(--fg); border-color: var(--t-obvious); }
.card .note { font-size: 13px; color: var(--muted); margin: 0; }
.card .lead { margin: 0; display: grid; gap: 2px; font-size: 15px; }
.card .lead .k { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.card details { background: var(--panel-2); }
.card summary { font-size: 14px; padding: 8px 12px; }
.ddev { padding: 0 12px 12px; display: grid; gap: 10px; }

/* ---------- controls and designer notes */
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.btn { font-family: var(--f-pixel); font-size: 15px; color: var(--bg); background: var(--neon); border: 0; padding: 8px 14px; cursor: pointer; }
.btn:focus-visible, .toggle input:focus-visible + span { outline: 2px solid var(--fg); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle span.sw { width: 30px; height: 16px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); position: relative; flex: none; }
.toggle span.sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 10px; height: 10px; background: var(--muted); transition: transform .15s; }
.toggle input:checked + span.sw { background: #3a1f40; box-shadow: inset 0 0 0 1px var(--neon); }
.toggle input:checked + span.sw::after { transform: translateX(14px); background: var(--neon); }
.keys { font-size: 13px; color: var(--muted); }
.notes { display: grid; gap: 14px; }
details { background: var(--panel); border: 1px solid var(--line); }
summary { cursor: pointer; padding: 12px 16px; font-family: var(--f-pixel); font-size: 16px; }
summary:focus-visible { outline: 2px solid var(--neon); outline-offset: -2px; }
.dbody { padding: 0 16px 16px; display: grid; gap: 12px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tier { font-family: var(--f-pixel); font-size: 13px; }
.tier.obvious { color: var(--t-obvious); } .tier.subtle { color: var(--t-subtle); } .tier.secret { color: var(--t-secret); } .tier.empty, .tier.bonus { color: var(--t-empty); }
.found { color: var(--t-obvious); font-family: var(--f-pixel); }
.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.rules li::marker { color: var(--neon); }
.src { font-size: 13px; color: var(--muted); }
.src a { color: var(--clue); }
@media (prefers-reduced-motion: reduce) { .pop, .more { animation: none; } }
@media (max-width: 640px) {
  .endcard { position: static; background: var(--panel); padding: 0; overflow: visible; }
  .card { box-shadow: none; border: 0; border-top: 2px solid var(--neon); width: 100%; padding: 16px 14px; }
}

/* ---------- the joint game: scene 1 takes the lantern's red and puts its HUD on the left (the TV is top right) */
:root { --girl: #ff9ccc; }
html[data-scene="1"] { --bg: #120c1a; --panel: #1b1426; --panel-2: #241b33; --line: #3a2e4f; --fg: #f1eaf6; --muted: #b0a2c0; --neon: #ff6a55; --thought: #d4c8ff; }
html[data-scene="1"] .hud, html[data-scene="1"] .hud-r { justify-content: flex-start; }
.who.girl { color: var(--girl); }
.dialog.low { top: auto; bottom: 2cqw; }   /* a look at something high up: the box moves down so the thing stays in view */
.cardbtns { display: flex; flex-wrap: wrap; gap: 10px; }
.opt:disabled { cursor: default; opacity: .55; }
.opt:not(:disabled) { transition: opacity .15s; }

/* ---------- the title screen: the art carries the title and the menu; the Play button sits over the drawn one */
.playbtn { position: absolute; left: 40.18%; top: 76.19%; width: 19.64%; height: 10.32%; background: transparent; border: 0; padding: 0;
  color: transparent; font-size: 1px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.playbtn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }
.titlescreen + .rotate { text-align: center; }

/* ---------- scene 3, not made yet: an empty rainy screen, a line, back to the title */
.tuned #screen { cursor: default; }
.tunedcard { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2.4cqw; padding: 4cqw; text-align: center; }
.tunedcard .eyebrow { margin: 0; font-size: clamp(11px, 2.2cqw, 15px); }
.tunedcard h2 { font-family: var(--f-pixel); font-weight: 600; font-size: clamp(17px, 4cqw, 30px); line-height: 1.15; margin: 0; max-width: 22ch; text-wrap: balance; }
</style>
</head>

// ================================================================ Title screen: Tokyo, '93
// The backdrop and the neon title come from title/title_game.py (two states: the I burnt out, the I flickering on).
// Rain, the blinking aviation lights and the menu (Play, high score, endings) are drawn here.
function title(A, api) {
const offs = [];
let alive = true;
const addEventListener = (ev, fn, o) => { window.addEventListener(ev, fn, o); offs.push(() => window.removeEventListener(ev, fn, o)); };
const requestAnimationFrame = fn => { if (alive) window.requestAnimationFrame(fn); };

const T = A.title, [W, H] = T.view, FONT = T.font, [PX, PY, PW, PH] = T.play;
const $ = s => document.querySelector(s);
const cv = $('#screen'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rec = api.records();
$('#records').textContent = `High score ${rec.best}. Endings unlocked ${rec.endings.length}.`;

const img = {};
function load() {
  return Promise.all(Object.entries(A.img).map(([n, src]) => new Promise(res => { const im = new Image(); im.onload = res; im.onerror = res; im.src = src; img[n] = im; })));
}

// ------------------------------------------------------------ the small pixel font (3x5, 4 px a letter)
function small(x, y, s, col) {
  ctx.fillStyle = col;
  [...s].forEach((ch, k) => (FONT[ch] || FONT[' ']).forEach((row, j) => [...row].forEach((v, i) => { if (v === 'X') ctx.fillRect(x + k * 4 + i, y + j, 1, 1); })));
}

// ------------------------------------------------------------ rain, lights, the flickering I
const rnd = (a, b) => a + Math.random() * (b - a);
const rain = Array.from({ length: reduceMotion ? 30 : 90 }, () => ({ x: rnd(0, W + 30), y: rnd(-10, H), v: rnd(90, 140), l: Math.random() < .3 ? 5 : 4 }));
const amb = { t: 0, flickAt: 2.5, flickEnd: 0 };
const lightPhase = T.lights.map(() => Math.random() * 2);
let hover = false, pressed = 0;

function update(dt) {
  amb.t += dt;
  for (const d of rain) {
    d.y += d.v * dt; d.x -= d.v * dt * .45;
    if (d.y > H) { d.y = rnd(-12, -2); d.x = rnd(0, W + 40); }
  }
  if (!reduceMotion && amb.t > amb.flickAt) { amb.flickEnd = amb.t + rnd(.15, .5); amb.flickAt = amb.t + rnd(3, 8); }
}
function draw() {
  const t = amb.t;
  const lit = t < amb.flickEnd && Math.floor(t * 18) % 3 !== 0;       // the I sputters on, then dies again
  ctx.drawImage(lit ? img.lit : img.dim, 0, 0);
  T.lights.forEach(([x, y], i) => {                                  // aviation lights: a slow red pulse
    if ((t + lightPhase[i]) % 2 < 1) return;
    ctx.fillStyle = 'rgb(255, 90, 90)'; ctx.fillRect(x, y, 1, 1);
    ctx.fillStyle = 'rgba(255, 70, 70, .35)'; ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y - 1, 1, 1);
  });
  ctx.fillStyle = 'rgba(170, 176, 230, .55)';
  for (const d of rain) for (let k = 0; k < d.l; k++) ctx.fillRect(Math.round(d.x - k * .45), Math.round(d.y - k), 1, 1);
  // the menu
  const on = hover || t < pressed;
  ctx.fillStyle = on ? '#3a1530' : '#0a0918'; ctx.fillRect(PX, PY, PW, PH);
  ctx.fillStyle = on ? '#ffd6ee' : '#ff5cb6';
  ctx.fillRect(PX, PY, PW, 1); ctx.fillRect(PX, PY + PH - 1, PW, 1); ctx.fillRect(PX, PY, 1, PH); ctx.fillRect(PX + PW - 1, PY, 1, PH);
  small(PX + 10, PY + 4, '> PLAY', '#faf4ff');
  small(6, H - 8, `HIGH SCORE ${rec.best}`, '#c8c2e6');
  const ends = `ENDINGS ${rec.endings.length}`;
  small(W - 5 - ends.length * 4, H - 8, ends, '#c8c2e6');
}

// ------------------------------------------------------------ input: the Play button sits over the drawn one
const play = $('#play');
const start = () => { if (!alive) return; pressed = amb.t + .25; setTimeout(() => { if (alive) api.start(); }, 180); };
play.addEventListener('click', start);
play.addEventListener('pointerenter', () => { hover = true; });
play.addEventListener('pointerleave', () => { hover = false; });
play.addEventListener('focus', () => { hover = true; });
play.addEventListener('blur', () => { hover = false; });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button, input, summary')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); }
});
$('#reset-records')?.addEventListener('click', () => { api.resetRecords(); api.newGame(); });

let last = 0;
function loop(ts) {
  if (!alive) return;
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
if (DEV) window.__t = { scene: 0, start };
load().then(() => { if (!alive) return; window.requestAnimationFrame(t => { last = t; loop(t); }); });
return () => { alive = false; offs.forEach(f => f()); };
}

// ================================================================ Scene 1: Daigo's sushi bar, 8:15 PM
// Lines follow the doc "Neon Rain — Scene 1". Runs inside the joint game: mount() puts tpl1 in the page,

function scene1(A, api) {
const addEventListener = (ev, fn, o) => { window.addEventListener(ev, fn, o); offs.push(() => window.removeEventListener(ev, fn, o)); };
const offs = [];
let alive = true;
const requestAnimationFrame = fn => { if (alive) window.requestAnimationFrame(fn); };

const [W, H] = A.bar.view, L = A.bar.L, C = A.chars;
const $ = s => document.querySelector(s);
const cv = $('#screen'), ctx = cv.getContext('2d');

// ------------------------------------------------------------ staging (screen pixels)
const DOOR_X = 20, STOOL_X = L.mercer, CHEF_HOME = L.chef, CHEF_BY_MERCER = L.mercer - 26;

// ------------------------------------------------------------ content
const th = t => ({ kind: 'thought', who: 'MERCER', t });

const doing = (line, on) => ({ ...line, on: line.on ? () => { line.on(); on(); } : on });

const ITEMS = {

  sake:     { name: 'Sake shelf', kind: 'none', pts: 0, lines: () => [th('Sake bottles. The good one sits highest.')] },

const NOTHING = 'Nothing here.';
const HOTSPOTS = A.bar.hot.filter(h => ITEMS[h.id]);             // the door and the register have no line: empty space
const SAKE = {
  tsukiyo:    { name: 'Tsukiyo', label: q('Tsukiyo.'), note: 'the top shelf' },
  minatogawa: { name: 'Minatogawa', label: q('Minatogawa.'), note: 'the house sake' },
  doburoku:   { name: 'Doburoku', label: q('Doburoku.'), note: 'from under the counter' },
};
const REACTION = {
  justice: { name: 'Justice', say: "A man's dead out there and nobody's even calling it in.", r: { clues: 1 } },
  greed:   { name: 'Greed', say: 'Dangerous neighborhood?', r: {}, note: 'no reward: the chef glances at the wooden box' },
  notmine: { name: 'Not my city', say: 'Not my city. Not my case. I fly at noon.', r: {}, note: 'no reward' },

for (const o of Object.values(REACTION)) o.label = q(o.say);
const BOX = 'A little wooden box. Inside, an envelope, KURODA brushed on it. Protection money.';

// ------------------------------------------------------------ state
let S;
function fresh() {
  return { mode: 'cut', taps: 10, clues: 0, yen: 0, minutes: 0, wasted: 0, found: {}, flags: {}, opening: null, sake: null,
           chefX: CHEF_HOME, chefTo: CHEF_HOME, dpose: 'slice', chefAlpha: 1, chefAway: false, mpose: null, side: null, girl: null,
           door: 0, doorTo: 0, tv: 'game', tvT0: 0, chefName: false };
}
S = fresh();
const waits = [];
const sleep = s => new Promise(r => waits.push({ t: amb.t + s, r }));
const after = (s, fn) => waits.push({ t: amb.t + s, r: fn });

// ------------------------------------------------------------ assets
const img = {};
function load() {
  return Promise.all(Object.entries(A.img).map(([n, src]) => new Promise(res => { const im = new Image(); im.onload = res; im.onerror = res; im.src = src; img[n] = im; })));
}

// ------------------------------------------------------------ HUD
function clock(m) {
  const t = START + m, h = Math.floor(t / 60) % 12 || 12, mm = String(t % 60).padStart(2, '0');
  return `${h}:${mm} PM`;
}
const yenFmt = n => '¥' + n.toLocaleString('en-US');
function hud() {
  $('#time').textContent = clock(S.minutes);
  $('#clues').textContent = S.clues;
  $('#yen').textContent = yenFmt(S.yen);
  renderSheet();
}
function pop(text, color, anchor) {
  const st = $('#stage').getBoundingClientRect(), a = $(anchor).getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text; el.style.color = color;
  el.style.left = (a.left - st.left) + 'px'; el.style.top = (a.bottom - st.top + 4) + 'px';
  $('#stage').appendChild(el);
  setTimeout(() => el.remove(), 1500);
}
function give(r) {
  if (r.clues) { S.clues += r.clues; pop(`+${r.clues} CLUE${r.clues > 1 ? 'S' : ''}`, 'var(--clue)', '#chip-clues'); }
  if (r.yen) { S.yen += r.yen * 10000; pop(`+${yenFmt(r.yen * 10000)}`, 'var(--yen)', '#chip-yen'); }
  hud();
}
const gainTag = r => r.clues ? { cls: 'clue', text: `Clues +${r.clues}` } : r.yen ? { cls: 'yen', text: `Yen +${yenFmt(r.yen * 10000)}` } : null;
const gained = (line, r) => ({ ...line, gain: gainTag(r), on: () => give(r) });

// ------------------------------------------------------------ dialogue
const dlg = $('#dialog');
let queue = [], cur = null, shown = 0, typing = false, onDone = null, menuOpen = false, badge = null;
function idle() { dlg.className = 'dialog idle'; dlg.innerHTML = ''; glowRelease(); }
let dlgLow = false;
function talk(lines, done, low = false) { queue = lines.slice(); onDone = done || null; dlgLow = low; next(); }
const play = (lines, low) => new Promise(r => talk(lines, r, low));
function next() {
  if (!queue.length) { cur = null; badge = null; idle(); const d = onDone; onDone = null; if (d) d(); return; }
  cur = queue.shift(); shown = 0; typing = true;
  badge = cur.gain || null;
  if (cur.on) cur.on();
  renderLine();
}
function renderLine() {
  dlg.className = 'dialog' + (dlgLow ? ' low' : '');
  const cls = cur.kind === 'guide' ? 'guide' : cur.who === 'MERCER' ? 'mercer' : cur.who === 'CHEF' ? 'tetsu' : cur.who === 'PARLOR GIRL' ? 'girl' : 'sys';
  const sub = cur.kind === 'thought' ? '<span class="sub">thinking</span>' : (cur.who === 'CHEF' || cur.who === 'PARLOR GIRL') ? '<span class="sub">in Japanese</span>' : '';
  const label = cur.who === 'CHEF' && S.chefName ? 'DAIGO' : cur.who;
  const who = cur.who ? `<div class="who ${cls}">${label}${sub}</div>` : '';
  const full = cur.kind === 'say' ? q(cur.t) : cur.t;
  const gain = badge ? `<span class="gain ${badge.cls}">${esc(badge.text)}</span>` : '';
  const head = who || gain ? `<div class="dhead">${who || '<span></span>'}${gain}</div>` : '';
  dlg.innerHTML = `${head}<div class="line ${cur.kind}">${esc(full.slice(0, Math.floor(shown)))}</div>${typing ? '' : '<div class="more" aria-hidden="true">▼</div>'}`;
  cur.full = full;
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function advance() {
  if (menuOpen || !cur) return;
  if (typing) { shown = cur.full.length; typing = false; renderLine(); return; }
  next();
}
function tickType(dt) {
  if (!cur || !typing) return;
  shown += dt * (reduceMotion ? 400 : 48);
  if (shown >= cur.full.length) { shown = cur.full.length; typing = false; }
  renderLine();
}
function menu(title, opts, asLines, low = false) {
  menuOpen = true; cur = null;
  dlg.className = 'dialog' + (low ? ' low' : '');
  dlg.innerHTML = `<div class="who mercer">MERCER${title ? '<span class="sub">thinking</span>' : ''}</div>${title ? `<div class="line thought">${esc(title)}</div>` : ''}<div class="opts${asLines ? ' lines' : ''}"></div>`;
  const box = dlg.querySelector('.opts');
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.dataset.key = o.key || '';
    b.innerHTML = `<span>${esc(o.label)}</span>`;
    b.disabled = true;                                    // a beat before the buttons take a tap, so the tap that finished
    setTimeout(() => { b.disabled = false; }, 450);       // the last line can't land on the first choice by accident
    b.addEventListener('click', e => { e.stopPropagation(); if (!menuOpen || b.disabled) return; menuOpen = false; o.go(); });
    box.appendChild(b);
    if (i === 0 && viaKeys) setTimeout(() => b.focus({ preventScroll: true }), 460);
  });
}
const choose = opts => new Promise(r => menu(null, opts.map(o => ({ key: o.key, label: o.label, go: () => { idle(); r(o.key); } })), true));

// ------------------------------------------------------------ people moving
// Mercer in profile (walking in and out) and the parlor girl share one mover: { x, tx, face, pose, dist, alpha, speed, done }
const walker = (x, face, speed) => ({ x, tx: x, face, pose: 'stand', dist: 0, alpha: 0, speed, done: null });
const walkTo = (w, toX, speed) => new Promise(r => { w.tx = toX; w.speed = speed; w.pose = 'walk'; w.done = () => { w.pose = 'stand'; r(); }; });
async function fade(w, to, steps = 8) { const from = w.alpha; for (let k = 1; k <= steps; k++) { w.alpha = from + (to - from) * k / steps; await sleep(.05); } }
async function chefGo(x) { S.chefTo = x; while (Math.abs(S.chefX - x) > .5 && S.chefTo === x) await sleep(.05); }   // gives up if someone sends him elsewhere
async function chefFade(to) { const from = S.chefAlpha; for (let k = 1; k <= 10; k++) { S.chefAlpha = from + (to - from) * k / 10; await sleep(.05); } }
async function enter() {
  S.doorTo = 1; await sleep(.4);
  S.side = walker(DOOR_X, 1, 38);
  await fade(S.side, 1);
  const w = walkTo(S.side, STOOL_X - 4, 38);
  after(1.2, () => { S.doorTo = 0; });
  await w;
  await sleep(.25);
  S.side = null; S.mpose = 'idle';                        // sits down, his back to us
}
function skipWalk() {
  for (const w of [S.side, S.girl]) {
    if (!w || S.mode !== 'cut' || Math.abs(w.tx - w.x) < .5) continue;
    w.dist += Math.abs(w.tx - w.x); w.x = w.tx; w.alpha = Math.max(w.alpha, .99);
  }
}
const turnTo = id => {
  const it = ITEMS[id]; if (it && it.reach) return it.reach;
  const h = HOTSPOTS.find(h => h.id === id); if (!h) return 'idle';
  const cx = (h.r[0] + h.r[2]) / 2;
  return cx < STOOL_X - 8 ? 'look_l' : cx > STOOL_X + 8 ? 'look_r' : 'nod';
};
async function serve(pose = 'pour', hold = .9) {          // the chef comes over to Mercer, does something, goes back
  S.dpose = 'idle'; await chefGo(CHEF_BY_MERCER);
  if (S.chefTo !== CHEF_BY_MERCER) return;
  S.dpose = pose; await sleep(hold);
  if (S.chefTo !== CHEF_BY_MERCER) return;
  S.dpose = 'idle'; await chefGo(CHEF_HOME);
}

// ------------------------------------------------------------ the parlor girl
async function girlIn() {
  S.mpose = 'look_l'; S.dpose = 'look';                   // the door: the chef stops cutting, he and Mercer look at her
  S.doorTo = 1; await sleep(.35);
  S.girl = walker(GIRL_DOOR_X, 1, 52);
  S.minutes = GIRL_AT; hud();
  await fade(S.girl, 1, 4);
  await walkTo(S.girl, GIRL_PHONE_X, 52);
  S.doorTo = 0;
  S.girl.face = -1; S.girl.pose = 'phone'; await sleep(.7);          // receiver off the hook, a coin in
  S.girl.pose = 'dial'; S.girl.shake = true; await sleep(1.8);        // a pager number, then a short code
  S.girl.pose = 'phone'; await sleep(.8);
  S.girl.pose = 'stand'; S.girl.shake = false; await sleep(.5);       // hangs up
  S.girl.face = 1;                                                    // turns to the counter
}
async function girlOut() {
  S.girl.face = -1;
  const w = walkTo(S.girl, GIRL_DOOR_X, 74);               // runs
  after(.15, () => { S.doorTo = 1; });
  await w;
  await fade(S.girl, 0, 4);
  S.girl = null;
  await sleep(.3); S.doorTo = 0;
}

// ------------------------------------------------------------ the scene: entrance, dinner, the girl, the reaction, looks, closing
async function opening() {
  S.mode = 'cut'; hud();
  await sleep(.6);
  await enter();
  await sleep(.5);
  // 1. Dinner
  await play([cl('Welcome. We close soon.'), sp("One drink. Then I'm gone.")]);
  await serve('pour', .8);                                // a hot towel
  await play([cl('Which would you like?')]);
  const sake = await choose(Object.keys(SAKE).map(k => ({ key: k, label: SAKE[k].label })));
  S.sake = sake;
  await play([sp(SAKE[sake].name + '.')]);
  S.dpose = 'idle'; await chefGo(CHEF_BY_MERCER);
  if (sake === 'tsukiyo') {
    S.dpose = 'still'; await sleep(.9);                    // up at the top shelf; holds the bottle a moment
    S.dpose = 'pour'; await sleep(1);
    await play([cl('Moonlit night. Nobody has opened it in two years.'), sp('Why tonight?'), cl('Tonight is a good night.')]);
  } else if (sake === 'minatogawa') {
    S.dpose = 'idle'; await sleep(1.1);                    // a flask warming in hot water
    S.dpose = 'pour'; await sleep(1);
    await play([cl("From the harbor towns. Honest sake. It doesn't pretend.")]);
  } else {
    S.dpose = 'bow'; await sleep(.9);                      // under the counter for the unlabeled bottle
    S.dpose = 'pour'; await sleep(1);
    await play([cl("I keep this one hidden. A fisherman brews it. Without a license. Don't tell anyone."), sp("Don't worry. I'm off duty here.")]);
  }
  S.dpose = 'idle'; await chefGo(CHEF_HOME); S.dpose = 'slice';
  S.mpose = 'drink'; await sleep(1.3); S.mpose = 'idle';
  await play([cl('You came in from the rain. Eat something.')]);
  await sleep(1.6);                                       // mackerel, shaped at the board
  await serve('pour', .7);                                // the plate in front of Mercer
  S.dpose = 'slice';
  S.mpose = 'nod'; await sleep(.9); S.mpose = 'idle';     // a piece
  await play([sp('Good fish.'), cl('It was swimming this morning.')]);
  // 2. Who Mercer is
  await play([cl('First time in Tokyo?'),
              sp("Last time. My flight's at noon."),
              cl('You were here for holidays?'),
              doing(sp("No, for my job. I'm a cop. I came to take a man home."), () => after(1.2, () => { S.dpose = 'still'; })),   // stops slicing, looks up
              cl('What did he do?'),
              sp('Shot two people in a liquor store in Queens. Then he got on a plane.'),
              doing(sp('Your judge found a typo in our papers. He walked out the front door this morning.'),
                    () => after(1.8, () => { S.dpose = 'nod'; after(.7, () => { S.dpose = 'slice'; }); })),   // he nods and goes back to slicing
              cl('The law is a net full of holes. The worst fish swim through.'),
              cl('The sake is on me.')]);
  // 3. The quiet
  await sleep(.6);
  S.mpose = 'nod'; await sleep(1); S.mpose = 'idle'; await sleep(1.2);
  S.mpose = 'drink'; await sleep(1.2); S.mpose = 'idle'; await sleep(.8);
  await play([th("Warm sake, good fish, a ballgame I can't follow. Not too bad for this damned city.")]);
  await sleep(.7);
  // 4. The parlor girl
  await girlIn();
  await play([cl("Sit down. I'll make you tea."),
              doing(gl("Kenji's dead. Behind the Paradise."), () => after(1, () => { S.dpose = 'still'; })),   // the knife stops
              cl('Kenji? He was sitting right there. Not long before you came in.'),
              doing(th('The stool next to mine is empty. A wallet lies on the counter in front of it.'), () => { S.mpose = 'look_l'; glowOn('wallet'); }),
              doing(sp('That wallet. His?'), () => glowRelease()),
              cl('Yes. He left in a hurry.'),
              sp("He won't be coming back for it."),
              sp('Did anyone call the police?'),
              gl('No, no police.')]);
  await girlOut();
  S.mpose = 'idle';
  await play([th('Strange. She ran here in the rain to use a payphone and type in a few numbers.')]);
  // 5. Mercer's reaction
  const pick = await choose(Object.keys(REACTION).map(k => ({ key: k, label: REACTION[k].label })));
  S.opening = pick;
  const o = REACTION[pick];
  if (pick === 'justice') {
    await play([sp(o.say),
                doing(txt("The chef refills Mercer's cup."), () => { serve('pour', 1); }),
                cl("The police know who he is and whose parlor that is. They'll take their time."),
                sp('You knew him?'),
                cl('He sat there every night. Mackerel and too much sake.'),
                gained(th('A man with habits. Somebody knew where to find him.'), o.r)]);
  } else if (pick === 'greed') {
    await play([sp(o.say),
                doing(txt('The chef glances at a little wooden box at the end of the counter.'), () => { S.dpose = 'glance'; glowOn('envelope'); }),
                doing(cl('Not for those who pay.'), () => glowRelease()),
                th('A wooden box at the end of the counter. Somebody collects on this street.')]);
  } else {
    await play([sp(o.say),
                cl('Wise. Here the rain washes everything away by morning.'),
                th("Still. A wallet nobody came back for, and a parlor that won't call the police.")]);
  }
  await chefGo(CHEF_HOME);
  S.dpose = 'idle';                                       // knife down
  await sleep(.4);
  await play([cl("I'll be right back. Eat now, the rice is getting cold.")]);
  await chefFade(0);                                      // through the curtain into the kitchen: the bar is Mercer's
  S.chefAway = true;
  S.minutes = LOOKS_AT; hud();
  await sleep(.5);
  await play([guide('Look around. Tap anything that catches your eye. Every tap is a look, even on a bare wall, and every look costs time.')]);
  S.mode = 'taps'; idle();
}

async function closing() {
  S.mode = 'cut';
  await sleep(.6);
  S.chefAway = false; S.dpose = 'idle';
  await chefFade(1);                                      // back through the curtain, drying his hands
  await sleep(.5);
  S.mpose = 'drink'; await sleep(1.3); S.mpose = 'idle';  // he empties his cup
  await sleep(.4);
  await play([th('Kenji left in a hurry and then got killed.'),
              sp('That Paradise parlor, where that man was killed. How far is it?'),
              cl('Two streets.'),
              sp("Then I've seen it. It's on my way. I might take a look."),
              doing(cl('Be careful, American. These are dangerous men, and this is not your city.'), () => after(.8, () => { S.dpose = 'still'; }))]);
  S.mpose = null; S.side = walker(STOOL_X - 4, -1, 30); S.side.alpha = 1;      // gets up
  await sleep(.5);
  await walkTo(S.side, STOOL_X - 44, 30);
  await play([cl('American, before you go…')]);
  S.side.face = 1; await sleep(.35);                      // turns back
  await play([sp("It's Nick. Nick Mercer. And you?"),
              doing(cl('Daigo.'), () => { S.chefName = true; S.dpose = 'idle'; }),
              cl("Nick-san. Take an umbrella. It's raining.")]);
  await sleep(.5);
  S.side.face = -1;
  const out = walkTo(S.side, DOOR_X, 30);                 // out into the rain, without one
  after(4, () => { S.doorTo = 1; });
  await out;
  await fade(S.side, 0, 10);
  S.side = null;
  await sleep(.3); S.doorTo = 0;
  S.dpose = 'slice';
  await sleep(1.2);
  end();
}

// ------------------------------------------------------------ looks
function award(id) {
  const it = ITEMS[id];
  S.taps--; S.minutes += LOOK_COST;
  S.found[id] = true;
  if (it.flag) S.flags[it.flag] = true;
  const pts = it.kind === 'none' ? 0 : it.pts;
  if (!pts && !it.fork) S.wasted++;                       // leaving the money is a choice, not a wasted look
  hud();
  const lines = it.lines();
  if (pts) { const i = lines.length - 1; const r = it.kind === 'clue' ? { clues: pts } : { yen: pts }; lines[i] = gained(lines[i], r); }
  look(id, lines, afterLook);
}
function look(id, lines, done) {

  const low = h ? (h.r[1] + h.r[3]) / 2 < 58 : false;    // high on the wall: the box moves down
  S.mpose = turnTo(it.fork || id);
  if (it.news) { S.tv = 'news'; S.tvT0 = amb.t; }        // between innings: the news

}
function replay(id) { look(id, ITEMS[id].after && S.found[id] ? ITEMS[id].after() : ITEMS[id].lines()); }   // the box is empty once the envelope is taken
function afterLook() { if (S.mode === 'taps' && S.taps <= 0) closing(); }

    if (S.found.walletCash) return replay('walletCash');
    if (S.found.walletCards) return replay('walletCards');
    S.mpose = 'reach_l';
    menu("Kenji's wallet. Cash on one side, cards on the other.", [
      { label: 'Take the cash', go: () => award('walletCash') },
      { label: 'Read the cards', go: () => award('walletCards') },
    ]);
  } else if (h.id === 'envelope') {
    if (S.found.envelopeTake) return replay('envelopeTake');
    if (S.found.envelopeLeave) return replay('envelopeLeave');
    S.mpose = turnTo('envelope');
    menu(BOX, [
      { label: 'Take the money', go: () => award('envelopeTake') },
      { label: 'Leave it', go: () => award('envelopeLeave') },

}

// ------------------------------------------------------------ glow: the looked-at object lights up
const glow = {};
function glowOn(id) { glow[id] = { t0: amb.t, open: true, tEnd: 0 }; }
function glowRelease() { for (const g of Object.values(glow)) if (g.open) { g.open = false; g.tEnd = amb.t; } }
function glowAlpha(id) {
  const g = glow[id]; if (!g) return 0;
  if (g.open) return Math.min(1, (amb.t - g.t0) / .12);
  const a = 1 - (amb.t - g.tEnd) / 1.0;
  if (a <= 0) { delete glow[id]; return 0; }
  return a;
}
function drawGlow(id) {
  const a = glowAlpha(id), m = A.bar.hi[id];
  if (!a || !m) return;
  ctx.save(); ctx.globalAlpha = a * .9;
  ctx.drawImage(img.hi_bar, m[0], 0, m[3], m[4], m[1], m[2], m[3], m[4]);
  ctx.restore();
}

// ------------------------------------------------------------ input
function hit(x, y) {
  const exact = [], near = [];
  for (const h of HOTSPOTS) {
    const p = h.pad || 0;
    if (x < h.r[0] - p || x >= h.r[2] + p || y < h.r[1] - p || y >= h.r[3] + p) continue;
    const dx = Math.max(h.r[0] - x, 0, x - (h.r[2] - 1)), dy = Math.max(h.r[1] - y, 0, y - (h.r[3] - 1));
    const c = { h, d: Math.hypot(dx, dy), a: (h.r[2] - h.r[0]) * (h.r[3] - h.r[1]) };
    (c.d === 0 ? exact : near).push(c);
  }
  if (exact.length) return exact.sort((p, q) => (p.h.cls - q.h.cls) || (p.a - q.a))[0].h;
  return near.sort((p, q) => (p.h.cls - q.h.cls) || (p.d - q.d))[0]?.h;
}
let marker = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (cur) { advance(); return; }
  if (menuOpen) return;
  if (S.mode === 'cut') { skipWalk(); return; }
  if (S.mode !== 'taps') return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  marker = { x, y, t: 0 };
  const h = hit(x, y);
  if (h) interact(h); else miss();
});
dlg.addEventListener('click', () => { if (cur) advance(); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, button, summary')) { if (e.key === ' ' || e.key === 'Enter') return; }
  if ((e.key === ' ' || e.key === 'Enter') && cur) { e.preventDefault(); advance(); }
  else if ((e.key === ' ' || e.key === 'Enter') && S.mode === 'cut' && !menuOpen) { e.preventDefault(); skipWalk(); }
});

// ------------------------------------------------------------ ambience
const rnd = (a, b) => a + Math.random() * (b - a);
const [wx0, wy0, wx1, wy1] = L.window;
const [tx0, ty0, tx1] = L.tank;
const [gx0, gy0, gx1, gy1] = DOOR_GAP;
const amb = { t: 0, glintAt: 4, glintOn: 0 };
const rain = Array.from({ length: reduceMotion ? 6 : 18 }, () => ({ x: rnd(wx0, wx1 + 10), y: rnd(wy0, wy1), v: rnd(70, 110) }));
const doorRain = Array.from({ length: reduceMotion ? 8 : 22 }, () => ({ x: rnd(gx0, gx1 + 12), y: rnd(gy0, gy1), v: rnd(80, 120) }));
const runs = Array.from({ length: 3 }, () => ({ x: Math.floor(rnd(wx0 + 1, wx1 - 1)), y: rnd(wy0, wy1), v: rnd(3, 7) }));
const fish = [{ x: 52, y: 71, v: 5, c: '#f08a3c' }, { x: 66, y: 75, v: -4, c: '#e8e2d0' }, { x: 58, y: 78, v: 3.5, c: '#d4423c' }];
const bubbles = [];
function ambience(dt) {
  const t = (amb.t += dt);
  for (const d of rain) { d.y += d.v * dt; d.x -= d.v * dt * .25; if (d.y > wy1) { d.y = wy0 - rnd(0, 6); d.x = rnd(wx0, wx1 + 10); } }
  for (const d of doorRain) { d.y += d.v * dt; d.x -= d.v * dt * .25; if (d.y > gy1) { d.y = gy0 - rnd(0, 6); d.x = rnd(gx0, gx1 + 12); } }
  for (const r of runs) { r.y += r.v * dt; if (r.y > wy1) { r.y = wy0; r.x = Math.floor(rnd(wx0 + 1, wx1 - 1)); } }
  for (const f of fish) { f.x += f.v * dt; if (f.x < tx0 + 2 || f.x > tx1 - 4) { f.v = -f.v; f.x = Math.max(tx0 + 2, Math.min(tx1 - 4, f.x)); } }
  if (Math.random() < dt * 1.2) bubbles.push({ x: tx0 + 22 + Math.floor(rnd(0, 3)), y: ty0 + 15 });
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].y -= 6 * dt; if (bubbles[i].y < ty0 + 2) bubbles.splice(i, 1); }
  if (t > amb.glintAt) { amb.glintOn = t + .2; amb.glintAt = t + rnd(5, 9); }
}
function moveActors(dt) {
  const d = S.chefTo - S.chefX;
  if (Math.abs(d) > .5) S.chefX += Math.sign(d) * Math.min(Math.abs(d), 26 * dt);
  else S.chefX = S.chefTo;
  for (const w of [S.side, S.girl]) {
    if (!w) continue;
    if (Math.abs(w.tx - w.x) > .5) {
      const step = Math.sign(w.tx - w.x) * Math.min(Math.abs(w.tx - w.x), w.speed * dt);
      w.x += step; w.dist += Math.abs(step); w.face = Math.sign(step);
    } else if (w.done) { w.x = w.tx; const r = w.done; w.done = null; r(); }
  }
  const dd = S.doorTo - S.door;
  if (Math.abs(dd) > .01) S.door += Math.sign(dd) * Math.min(Math.abs(dd), dt * 2.2); else S.door = S.doorTo;
}

// ------------------------------------------------------------ draw
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); }
function frame(im, i, fw, fh, x, y, flip = false, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  if (flip) { ctx.translate(x + fw, 0); ctx.scale(-1, 1); ctx.drawImage(im, i * fw, 0, fw, fh, 0, y, fw, fh); }
  else ctx.drawImage(im, i * fw, 0, fw, fh, x, y, fw, fh);
  ctx.restore();
}
function tvFrame() {
  if (S.tv === 'game') return Math.floor(amb.t * 2) % 2 ? 'game1' : 'game0';
  return amb.t - S.tvT0 < 1.2 ? 'news' : 'anchor';
}
function drawDoor(t) {                                    // the sliding door, open on the street by S.door
  const w = Math.round((gx1 - gx0) * S.door);
  if (w <= 0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(gx0, gy0, w, gy1 - gy0); ctx.clip();
  const g = ctx.createLinearGradient(0, gy0, 0, gy1);
  g.addColorStop(0, '#120f2c'); g.addColorStop(.62, '#1c1736'); g.addColorStop(.66, '#2a1c3a'); g.addColorStop(1, '#3a2240');
  ctx.fillStyle = g; ctx.fillRect(gx0, gy0, w, gy1 - gy0);
  ctx.fillStyle = 'rgba(255, 92, 182, .18)'; ctx.fillRect(gx0, gy0 + 40, w, 18);               // pink neon on the wet street
  ctx.fillStyle = `rgba(255, 140, 110, ${.25 + .08 * Math.sin(t * 3.1)})`; ctx.fillRect(gx0, gy0 + 38, w, 1);   // the far kerb catching the lantern
  ctx.fillStyle = 'rgba(190, 196, 255, .55)';
  for (const d of doorRain) for (let k = 0; k < 4; k++) ctx.fillRect(Math.round(d.x + k * .25), Math.round(d.y - k), 1, 1);
  ctx.restore();
  ctx.fillStyle = '#3c2416'; ctx.fillRect(gx0 + w, gy0, 1, gy1 - gy0);                         // the edge of the sliding panel
}
let showHot = false;
function draw() {
  const t = amb.t;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(img.back, 0, 0);
  drawDoor(t);
  // the street through the window: rain, the swinging lantern and its glow
  ctx.save(); ctx.beginPath(); ctx.rect(wx0, wy0, wx1 - wx0, wy1 - wy0); ctx.clip();
  ctx.fillStyle = 'rgba(190, 196, 255, .45)';
  for (const d of rain) for (let k = 0; k < 4; k++) ctx.fillRect(Math.round(d.x + k * .25), Math.round(d.y - k), 1, 1);
  const sway = reduceMotion ? 0 : Math.round(Math.sin(t * 1.6) * 1.2);
  const [lx, ly] = L.lantern;
  const pulse = .16 + .05 * Math.sin(t * 3.1);
  const gr = ctx.createRadialGradient(lx + 3.5 + sway, ly + 6, 0, lx + 3.5 + sway, ly + 6, 14);
  gr.addColorStop(0, `rgba(255, 110, 80, ${pulse})`); gr.addColorStop(1, 'rgba(255, 80, 60, 0)');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gr; ctx.fillRect(wx0, wy0, wx1 - wx0, wy1 - wy0); ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = '#1e141e'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(lx + 3.5, wy0); ctx.lineTo(lx + 3.5 + sway, ly); ctx.stroke();
  ctx.drawImage(img.lantern, lx + sway, ly);
  ctx.restore();
  ctx.fillStyle = '#3c2622'; ctx.fillRect((wx0 + wx1) >> 1, wy0, 1, wy1 - wy0); ctx.fillRect(wx0, (wy0 + wy1) >> 1, wx1 - wx0, 1);
  ctx.fillStyle = 'rgba(200, 220, 255, .35)';
  for (const r of runs) ctx.fillRect(r.x, Math.round(r.y), 1, 2);
  // the fish tank
  ctx.save(); ctx.beginPath(); ctx.rect(tx0, ty0 + 2, tx1 - tx0, 14); ctx.clip();
  for (const f of fish) { const x = Math.round(f.x), y = Math.round(f.y), dir = f.v > 0 ? 1 : -1; px(x, y, f.c); px(x + dir, y, f.c); px(x - dir, y + (Math.floor(t * 6) % 2), f.c); px(x + 2 * dir, y, '#20202a'); }
  for (const b of bubbles) px(b.x, b.y, 'rgba(220, 245, 255, .7)');
  ctx.restore();
  if (S.flags.ringTaken) ctx.drawImage(img.ring_gone, A.bar.ringGone[0], A.bar.ringGone[1]);
  else if (t < amb.glintOn) { px(tx0 + 16, ty0 + 13, '#ffffff'); px(tx0 + 15, ty0 + 14, 'rgba(255,255,255,.6)'); px(tx0 + 17, ty0 + 14, 'rgba(255,255,255,.6)'); }
  for (const id in A.bar.hi) if (!A.bar.hiFront.includes(id)) drawGlow(id);   // the TV case lights up; its screen is drawn over it
  // the TV and its light on the wall
  const tf = tvFrame(), [tw, th_] = C.tv;
  ctx.drawImage(img.tv, C.tvFrames.indexOf(tf) * tw, 0, tw, th_, L.tv[0], L.tv[1], tw, th_);
  const flick = .06 + .04 * Math.abs(Math.sin(t * 7.3)) * (t % 1.7 < .9 ? 1 : .4);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const tg = ctx.createRadialGradient(208, 24, 2, 208, 24, 34);
  const tcol = tf.startsWith('game') ? '120, 200, 140' : '120, 150, 255';
  tg.addColorStop(0, `rgba(${tcol}, ${flick})`); tg.addColorStop(1, `rgba(${tcol}, 0)`);
  ctx.fillStyle = tg; ctx.fillRect(170, 0, 54, 70); ctx.restore();
  // the chef behind the counter
  const [dw, dh] = C.daigo;
  let dp = S.dpose;
  if (dp === 'slice') dp = 'slice' + [0, 1, 2, 3, 3, 0, 0, 0][Math.floor(t * 7) % 8];
  const moving = Math.abs(S.chefTo - S.chefX) > .5;
  if (moving) dp = 'idle';
  const bob = moving && Math.floor(t * 6) % 2 ? 1 : 0;
  if (S.chefAlpha > 0) frame(img.daigo, C.daigoFrames.indexOf(dp), dw, dh, Math.round(S.chefX) - 18, C.daigoTop + bob, false, S.chefAlpha);
  ctx.drawImage(img.front, 0, 0);
  if (S.flags.envelopeTaken) ctx.drawImage(img.envelope_gone, A.bar.envelopeGone[0], A.bar.envelopeGone[1]);
  for (const id of A.bar.hiFront) drawGlow(id);
  // the parlor girl, by the payphone

  // Mercer: seated with his back to us, or standing in profile when he walks in and out
  const [bw, bh] = C.mercerBack, [mx, my] = C.mercerBackAt;
  if (!S.side && S.mpose) {
    let mp = S.mpose;
    if (mp === 'idle') mp = Math.floor(t / 1.1) % 2 ? 'breathe' : 'idle';
    frame(img.mercer_back, C.mercerBackFrames.indexOf(mp), bw, bh, mx, my);
  } else {
    frame(img.mercer_back, C.mercerBackFrames.indexOf('empty'), bw, bh, mx, my);
  }
  if (S.side) {
    const [sw, sh] = C.mercerSide, F = C.mercerSideFrames, s = S.side;
    const f = s.pose === 'walk' ? F.walk + Math.floor(s.dist / 5.5) % 8 : (Math.floor(t / 1.1) % 2 ? F.breathe : F.idle);
    frame(img.mercer_side, f, sw, sh, Math.round(s.x) - sw / 2, 125 - sh, s.face < 0, s.alpha);
  }
  if (marker) {
    const k = marker.t / .35, r = 1 + k * 4; ctx.fillStyle = `rgba(214,255,150,${1 - k})`;
    const mx2 = Math.round(marker.x), my2 = Math.round(marker.y);
    ctx.fillRect(mx2 - r, my2, 1, 1); ctx.fillRect(mx2 + r, my2, 1, 1); ctx.fillRect(mx2, my2 - r, 1, 1); ctx.fillRect(mx2, my2 + r, 1, 1);
  }
  if (showHot && S.mode === 'taps') {
    for (const h of HOTSPOTS) {
      const p = h.pad || 0;
      ctx.strokeStyle = h.cls ? 'rgba(200, 190, 230, .7)' : '#b9dc8c'; ctx.setLineDash(h.cls ? [2, 2] : []);
      ctx.strokeRect(h.r[0] - p + .5, h.r[1] - p + .5, h.r[2] - h.r[0] + 2 * p - 1, h.r[3] - h.r[1] + 2 * p - 1);
    }
    ctx.setLineDash([]);
  }
}
function drawGirl(t) {
  const g = S.girl, [gw, gh] = C.girl, F = C.girlFrames;
  const f = g.pose === 'walk' ? F.walk + Math.floor(g.dist / 4.5) % 8 : g.pose === 'phone' ? F.phone : g.pose === 'dial' ? F.dial : (Math.floor(t / .9) % 2 ? F.breathe : F.idle);
  const jit = g.shake && !reduceMotion && Math.floor(t * 9) % 3 === 0 ? 1 : 0;     // cold, and scared: her hand shakes
  const left = Math.round(g.x) - gw / 2, top = GIRL_FEET - (gh - 4), flip = g.face < 0;
  frame(img.girl, f, gw, gh, left, top, flip, g.alpha);
  if (g.pose === 'phone' || g.pose === 'dial') {                                 // the receiver cord down to the payphone
    const fx = 20, fy = 5 + 12;

    ctx.strokeStyle = '#b8487e'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(rx + .5 + jit, ry + .5); ctx.quadraticCurveTo((rx + PHONE_JACK[0]) / 2, Math.max(ry, PHONE_JACK[1]) + 7, PHONE_JACK[0] + .5, PHONE_JACK[1] + .5); ctx.stroke();
  }

}

// ------------------------------------------------------------ loop
let last = 0;
function loop(ts) {
  if (!alive) return;
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  ambience(dt);
  moveActors(dt);
  if (marker && (marker.t += dt) > .35) marker = null;
  const due = waits.filter(w => amb.t >= w.t);
  if (due.length) { for (const w of due) waits.splice(waits.indexOf(w), 1); due.forEach(w => w.r()); }
  tickType(dt);
  draw();
  requestAnimationFrame(loop);
}

// ------------------------------------------------------------ designer sheet
function renderSheet() {
  if (!DEV) return;                                       // the player build has no designer sheet
  const rows = ['walletCash', 'walletCards', 'note', 'tv', 'envelopeTake', 'envelopeLeave', 'ribbon', 'tank', 'umbrella', 'noren', 'phone', 'sake', 'menu', 'lantern', 'rice'];
  const rew = it => it.kind === 'clue' ? `${it.pts} clue${it.pts > 1 ? 's' : ''}` : it.kind === 'yen' ? yenFmt(it.pts * 10000) : '—';
  const extra = { walletCash: ' · fork', walletCards: ' · fork, sets walletCards', note: ' · sets noteFound', ribbon: ' · sets ribbonFound', envelopeTake: ' · fork, sets envelopeTaken', envelopeLeave: ' · fork' };
  const sake = Object.entries(SAKE).map(([k, o]) => `<tr><td>Sake: ${o.name}</td><td>${esc(o.label)} ${esc(o.note)}</td><td class="num">—</td><td>${S.sake === k ? '<span class="found">✓</span>' : ''}</td></tr>`).join('');
  const reaction = Object.entries(REACTION).map(([k, o]) => `<tr><td>Reaction: ${o.name}</td><td>${esc(o.label)}</td><td class="num">${o.r.clues ? `+${o.r.clues} clue` : '—'}${o.note ? ` · ${esc(o.note)}` : ''}</td><td>${S.opening === k ? '<span class="found">✓</span>' : ''}</td></tr>`).join('');
  $('#sheet-table').innerHTML = `<thead><tr><th>Look or choice</th><th>Line</th><th>Reward</th><th>Found</th></tr></thead><tbody>${sake}${reaction}${rows.map(id => {
    const it = ITEMS[id];
    return `<tr><td>${esc(it.name)}</td><td>${esc(it.lines()[0].t)}</td><td class="num">${rew(it)}${extra[id] || ''}</td><td>${S.found[id] ? '<span class="found">✓</span>' : ''}</td></tr>`;
  }).join('')}</tbody>`;
}

// ------------------------------------------------------------ boot

  waits.length = 0;
  queue = []; cur = null; onDone = null; menuOpen = false; badge = null; marker = null;
  S = fresh();
  for (const id in glow) delete glow[id];
  $('#endcard').hidden = true; $('#endcard').innerHTML = ''; dlg.hidden = false;
  idle(); hud(); opening();
}
$('#restart')?.addEventListener('click', restart);
$('#skip')?.addEventListener('click', () => api.next(carry()));
$('#opt-hotspots')?.addEventListener('change', e => { showHot = e.target.checked; });
if (DEV) window.__t = { scene: 1, get S() { return S; }, get cur() { return cur; }, get menuOpen() { return menuOpen; }, advance, skipWalk, tap: id => interact(HOTSPOTS.find(h => h.id === id)), miss };   // handle for the Playwright tests
showHot = !!$('#opt-hotspots')?.checked;
hud();
load().then(() => { if (!alive) return; opening(); window.requestAnimationFrame(t => { last = t; loop(t); }); });
return () => { alive = false; waits.length = 0; offs.forEach(f => f()); };
}

const requestAnimationFrame = fn => { if (alive) window.requestAnimationFrame(fn); };
const [SW, VH, CAMY, WORLD] = A.view, SH = 180, CAMMAX = WORLD - SW, FEET = 172, SPEED = 60;

// ------------------------------------------------------------ staging (world pixels)
const SPOT = L.tetsu[0] - 40;          // Mercer talks to Tetsu from his left, at speaking distance

// ------------------------------------------------------------ content

// Lines follow the doc "Neon Rain — Scene 2" (scene 2).

for (const [id, [name, line]] of Object.entries(SCENERY)) ITEMS[id] = { name, tier: 'scenery', kind: 'none', pts: 0, lines: () => [th(line)] };
const NOTHING = 'Nothing here.';
// tap areas in world pixels [x0, y0, x1, y1), exported by the art build; objects without a line (the ladder) count as empty ground
const HOTSPOTS = A.hot.filter(h => h.id === 'jacket' || ITEMS[h.id]);
const TIER_COLOR = { obvious: '#7ad38b', subtle: '#f3c85e', secret: '#ff5cb6', empty: '#8b87b4', scenery: '#6f6a99' };

// Choice rewards. 1 point = 1 clue or 10,000 yen.
// A spoken choice's button is Mercer's first line (say); an action's button is in brackets.
const OPENING = {
  smart:   { name: 'Smart', say: "Your people don't usually leave a body lying around.", r: { clues: 1 } },
  cynical: { name: 'Cynical', say: "That's not how you get rid of blood.", r: { yen: 1 } },

for (const o of [...Object.values(OPENING), ...Object.values(FINAL)]) if (o.say) o.label = q(o.say);

// ------------------------------------------------------------ state
let S;
function fresh() {
  return { x: SPOT, tx: SPOT, face: 1, dist: 0, cam: SPOT - SW / 2, taps: 10, clues: carry.clues, yen: carry.yen, violence: 0, minutes: 0, wasted: 0,
           found: {}, chained: {}, flags: {}, mode: 'cut', opening: null, final: null,
           tpose: 'mop', mop: 'held', bucket: 'up', mpose: null, camTarget: null, mopKicked: false, tetsuName: false,
           noteFound: !!carry.flags.noteFound };    // from scene 1; the counters carry on too
}
S = fresh();
let pending = null, autoWalk = false, keys = { l: false, r: false };

// game-time waits for the scene script; cleared on restart so an abandoned script never resumes
const waits = [];
const sleep = s => new Promise(r => waits.push({ t: amb.t + s, r }));
const after = (s, fn) => waits.push({ t: amb.t + s, r: fn });
let walkSpeed = SPEED;                  // px per second; slower for the entrance
function walkAuto(x, speed = SPEED) { return new Promise(r => { autoWalk = true; walkSpeed = speed; S.tx = x; pending = () => { autoWalk = false; walkSpeed = SPEED; r(); }; }); }

// ------------------------------------------------------------ assets
const img = {};
const NAMES = ['sky', 'far', 'mid', 'main', 'fg', 'sign_off', 'mercer', 'tetsu', 'cat', 'hi_main', 'hi_far', 'tetsu_hi', 'cat_hi',
               'tetsu_dead', 'mop_lean', 'mop_floor', 'bucket_tipped', 'bucket_gone'];

// ------------------------------------------------------------ HUD
function clock(m) {
  const t = 21 * 60 + m, h = Math.floor(t / 60) % 12 || 12, mm = String(t % 60).padStart(2, '0');
  return `${h}:${mm} PM`;
}
const yenFmt = n => '¥' + n.toLocaleString('en-US');
function hud() {
  $('#time').textContent = clock(S.minutes);
  $('#clues').textContent = S.clues;
  $('#yen').textContent = yenFmt(S.yen);
  renderSheet();
}
function pop(text, color, anchor) {
  const st = $('#stage').getBoundingClientRect(), a = $(anchor).getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text; el.style.color = color;
  el.style.left = (a.left - st.left) + 'px'; el.style.top = (a.bottom - st.top + 4) + 'px';
  $('#stage').appendChild(el);
  setTimeout(() => el.remove(), 1500);
}
function give(r) {
  if (r.clues) { S.clues += r.clues; pop(`+${r.clues} CLUE${r.clues > 1 ? 'S' : ''}`, 'var(--clue)', '#chip-clues'); }
  if (r.yen) { S.yen += r.yen * 10000; pop(`+${yenFmt(r.yen * 10000)}`, 'var(--yen)', '#chip-yen'); }
  if (r.violence) S.violence += r.violence;     // hidden stat
  hud();
}
const gainTag = r => r.clues ? { cls: 'clue', text: `Clues +${r.clues}` } : r.yen ? { cls: 'yen', text: `Yen +${yenFmt(r.yen * 10000)}` } : null;
// a line that pays out when it appears, with its tag
const gained = (line, r) => ({ ...line, gain: gainTag(r), on: () => give(r) });

// ------------------------------------------------------------ dialogue
const dlg = $('#dialog');
let queue = [], cur = null, shown = 0, typing = false, onDone = null, menuOpen = false, badge = null;
function idle() {
  dlg.className = 'dialog idle'; dlg.innerHTML = '';
  glowRelease();                          // no reminder here: the HOW TO PLAY line at the start says it once
}
function talk(lines, done) { queue = lines.slice(); onDone = done || null; next(); }
const play = lines => new Promise(r => talk(lines, r));
function next() {
  if (!queue.length) { cur = null; badge = null; idle(); const d = onDone; onDone = null; if (d) d(); return; }
  cur = queue.shift(); shown = 0; typing = true;
  badge = cur.gain || null;              // the reward tag sits on the line that pays it
  if (cur.on) cur.on();
  renderLine();
}
function renderLine() {
  dlg.className = 'dialog';
  const label = cur.who === 'TETSU' && !S.tetsuName ? 'CLEANER' : cur.who;
  const who = cur.who ? `<div class="who ${cur.kind === 'guide' ? 'guide' : cur.who === 'MERCER' ? 'mercer' : cur.who === 'TETSU' ? 'tetsu' : 'sys'}">${label}${cur.kind === 'thought' ? '<span class="sub">thinking</span>' : cur.who === 'TETSU' ? '<span class="sub">in Japanese</span>' : ''}</div>` : '';
  const full = cur.kind === 'say' ? q(cur.t) : cur.t;
  const txt = full.slice(0, Math.floor(shown));
  const gain = badge ? `<span class="gain ${badge.cls}">${esc(badge.text)}</span>` : '';
  const head = who || gain ? `<div class="dhead">${who || '<span></span>'}${gain}</div>` : '';
  dlg.innerHTML = `${head}<div class="line ${cur.kind}">${esc(txt)}</div>${typing ? '' : '<div class="more" aria-hidden="true">▼</div>'}`;
  cur.full = full;
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function advance() {
  if (menuOpen || !cur) return;
  if (typing) { shown = cur.full.length; typing = false; renderLine(); return; }
  next();
}
function tickType(dt) {
  if (!cur || !typing) return;
  shown += dt * (reduceMotion ? 400 : 48);
  if (shown >= cur.full.length) { shown = cur.full.length; typing = false; }
  renderLine();
}
function menu(title, opts, asLines) {
  menuOpen = true; cur = null;
  dlg.className = 'dialog';
  dlg.innerHTML = `<div class="who mercer">MERCER</div>${title ? `<div class="line thought">${esc(title)}</div>` : ''}<div class="opts${asLines ? ' lines' : ''}"></div>`;
  const box = dlg.querySelector('.opts');
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.dataset.key = o.key || '';
    b.innerHTML = `<span>${esc(o.label)}</span>`;
    b.disabled = true;                                    // a beat before the buttons take a tap, so the tap that finished
    setTimeout(() => { b.disabled = false; }, 450);       // the last line can't land on the first choice by accident
    b.addEventListener('click', e => { e.stopPropagation(); if (!menuOpen || b.disabled) return; menuOpen = false; o.go(); });
    box.appendChild(b);
    if (i === 0 && viaKeys) setTimeout(() => b.focus({ preventScroll: true }), 460);
  });
}
// a dialogue choice: the buttons are what Mercer says (or does, in brackets)
const choose = opts => new Promise(r => menu(null, opts.map(o => ({ key: o.key, label: o.label, go: () => { idle(); r(o.key); } })), true));

// ------------------------------------------------------------ the scene: entrance, opening talk, looks, finale
async function opening() {
  S.mode = 'cut'; S.x = S.tx = ENTRY; S.cam = 0; S.face = 1; hud();
  await walkAuto(SPOT, 38);             // a slow walk in, no text box, so the neon and the body stay in view
  await sleep(.45);
  // the cleaner keeps mopping and doesn't look up; the mop stops for one beat at the badge
  await play([cl('Wrong street, foreigner.'),
              doing(txt('Mercer holds up his badge.'), () => after(.45, () => { S.tpose = 'still'; after(.8, () => { S.tpose = 'mop'; }); })),
              cl("That doesn't work here."),
              th('Two fingers missing on his left hand. Yakuza.'),
              sp('MERCER', 'The man under the tarp. Kenji. One of yours?'),
              cl('Go home.')]);
  const keys_ = ['smart', 'cynical', 'hard', ...(S.noteFound ? ['note'] : [])];
  const pick = await choose(keys_.map(k => ({ key: k, label: OPENING[k].label })));
  S.opening = pick;
  const o = OPENING[pick], R = o.r;
  if (pick === 'smart') {
    await play([sp('MERCER', o.say), cl('The parlor found him first.'), gained(th("So the clan didn't plan this one."), R)]);
  } else if (pick === 'cynical') {
    await play([doing(sp('MERCER', o.say), () => after(.7, () => { S.tpose = 'still'; })),
                sp('MERCER', 'Cold water. Hot sets it.'),
                txt('He holds out a folded bill without looking at him.'),
                gained(cl('Go drink somewhere.'), R)]);
  } else if (pick === 'note') {
    await play([doing(sp('MERCER', o.say), () => { S.tetsuName = true; }), gained(cl('Never bleach.'), R)]);
  } else {
    S.mpose = 'kick'; await sleep(.12);
    S.tpose = 'nomop'; S.mop = 'fly'; fx.mop = amb.t; S.mopKicked = true;
    await sleep(.4); S.mpose = null;
    await sleep(.45);
    await play([doing(txt("The cleaner's hand drops toward his ankle knife, but he notices the security camera and changes his mind."), () => give(R))]);
  }
  await sleep(.3);
  S.tpose = S.mopKicked ? 'wait' : 'mop';                    // back to work without a word; a kicked mop stays down
  await sleep(.6);
  await play([guide('Look around. Walk with the arrows and tap anything that catches your eye. Every tap is a look, even on empty ground, and every look costs time.')]);
  S.mode = 'taps'; idle();
}

async function finale() {
  S.mode = 'cut'; pending = null; autoWalk = false; keys.l = keys.r = false;
  await sleep(.5);
  if (Math.abs(S.x - SPOT) > .5) await walkAuto(SPOT);
  await sleep(.25); S.face = 1;
  if (!S.mopKicked) S.tpose = 'still';    // he stops mopping; a kicked mop stays on the ground
  await sleep(.45);
  await play([sp('MERCER', "That's a lot of mopping for a man who didn't do it."), th('His hand drifts toward the knife.')]);
  const g = gate();
  const ks = ['greed', ...(g.n >= 2 ? ['justice'] : []), 'violence'];
  const pick = await choose(ks.map(k => ({ key: k, label: FINAL[k].label })));
  S.final = pick;
  const o = FINAL[pick], R = o.r;
  if (pick === 'greed') {
    await play([sp('MERCER', o.say),
                gained(txt("He folds a few bills into Mercer's breast pocket."), R),
                cl('So you clean up too. You were never here. You never saw this.'),
                cl('Kuroda hired a girl to watch him. Mika. She let him walk out alone.'),
                cl('She sits on the karaoke tower roof. Blame her, not us.')]);
    if (!S.mopKicked) { await sleep(.4); S.tpose = 'mop'; }
    S.flags.tetsuEnding = 'paid';
  } else if (pick === 'justice') {
    const f = S.flags, ev = [];       // one line for each clearing clue
    if (f.knifeFound && f.cutFound) ev.push(sp('MERCER', "Your knife's too blunt for that cut."));
    if (f.shirtFound) ev.push(sp('MERCER', "There's not a drop of blood on your shirt."));
    if (f.tetsuPagerFound) ev.push(sp('MERCER', 'The parlor paged you at 8:32. You came after the body was found.'));
    await play([sp('MERCER', o.say), ...ev,
                gained(cl("We don't kill our own. Ask the girl he drank with tonight."), R),
                cl("Kuroda's girl. Mika. The roof of the karaoke tower."),
                txt('He looks scared.'),
                cl('The dead men did a job together. Two years ago. A debt from this parlor.'),
                sp('MERCER', 'Whose debt?'),
                cl('…')]);
    S.flags.tetsuEnding = 'talked';
  } else {
    S.mpose = 'draw'; after(.16, () => { S.mpose = 'aim'; });
    after(.35, () => { if (S.mop === 'held') { S.mop = 'fly'; fx.mop = amb.t; } S.tpose = 'kneel'; });   // hands up: a held mop drops where a kicked one lands
    await sleep(1.1);
    await play([doing(cl("Mika! Kuroda's girl! She was with him! The karaoke roof!"), () => give(R))]);
    await sleep(.35);
    shoot(1); await sleep(.55);
    shoot(2); await sleep(.16);
    S.tpose = 'dead'; S.bucket = 'tipped'; pool = { t0: amb.t };
    splash(TIPPED[0] + 20, TIPPED[1] + 12, 16, PINK);
    after(1.3, () => { S.mpose = 'draw'; });
    await sleep(2.4);
    S.flags.tetsuEnding = 'shot';
  }
  await sleep(.7);
  end();
}

// ------------------------------------------------------------ looks
function award(id) {
  const it = ITEMS[id];
  const chained = it.chain ? it.chain() : false;
  S.taps--; S.minutes += 3;
  S.found[id] = true;
  if (chained) S.chained[id] = true;
  const clearedBefore = gate().n;
  if (it.flag) S.flags[it.flag] = true;
  const cleared = gate().n;
  const pts = it.kind === 'none' ? 0 : it.pts + (chained ? 1 : 0);
  if (!pts) S.wasted++;
  hud();
  // rewards close the line that pays them; a chain bonus with a line of its own is paid on that line
  const lines = it.lines(chained);
  const pay = (i, n, chain) => { lines[i] = { ...lines[i], gain: gainOf(it, n, chain), on: () => payOut(it, n, chain) }; };
  const ci = chained ? lines.findIndex(l => l.chain) : -1;
  const last = lines.map(l => !l.tail && !l.chain).lastIndexOf(true);   // the find pays on its last line; a tail (a hint after it) and a chain line don't
  if (pts && ci >= 0) { pay(ci, 1, 'own'); pay(last, it.pts, false); }
  else if (pts) pay(last, pts, chained);
  // a clue that clears the cleaner, but not yet enough for Justice: a nudge to keep looking at him
  if (cleared > clearedBefore && cleared < 2) {
    const t = lines.findIndex(l => l.tail);
    lines.splice(t < 0 ? lines.length : t, 0, { ...th(`Let's see if I find other clues about ${S.tetsuName ? 'Tetsu' : 'the cleaner'}.`), tail: true });
  }
  talk(lines, afterLook);
}
function payOut(it, n, chain) {
  const tag = chain ? ' (chain)' : '';
  if (it.kind === 'clue') { S.clues += n; pop(`+${n} CLUE${n > 1 ? 'S' : ''}${tag}`, 'var(--clue)', '#chip-clues'); }
  if (it.kind === 'yen') { S.yen += n * 10000; pop(`+${yenFmt(n * 10000)}`, 'var(--yen)', '#chip-yen'); }
  hud();
}
function gainOf(it, n, chain) {
  const tag = chain === 'own' ? ' (chain)' : chain ? ' (chain +1)' : '';
  if (it.kind === 'clue') return { cls: 'clue', text: `Clues +${n}${tag}` };
  if (it.kind === 'yen') return { cls: 'yen', text: `Yen +${yenFmt(n * 10000)}` };
  return null;
}
function replay(id) { talk(ITEMS[id].lines(!!S.chained[id])); }
function afterLook() { if (S.mode === 'taps' && S.taps <= 0) finale(); }
function miss() {
  S.taps--; S.minutes += 3; S.wasted++;

// ------------------------------------------------------------ movement and input
const free = () => S.mode === 'taps' && !cur && !menuOpen;
function walkTo(x, then) { S.tx = Math.max(12, Math.min(WORLD - 12, x)); pending = then || null; }
function hit(sx, sy) {
  // sx, sy in view pixels. Exact hits: the smallest object wins (a fuse box beats the wall it hangs on).
  // Near misses: story objects have extra padding and win over scenery, then the nearest wins.
  const cam = Math.round(S.cam), wy = sy + CAMY, exact = [], near = [];
  for (const h of HOTSPOTS) {
    const x = sx + (h.layer === 'far' ? Math.round(cam * F.far) : cam), p = h.pad || 0;
    if (x < h.r[0] - p || x >= h.r[2] + p || wy < h.r[1] - p || wy >= h.r[3] + p) continue;
    const dx = Math.max(h.r[0] - x, 0, x - (h.r[2] - 1)), dy = Math.max(h.r[1] - wy, 0, wy - (h.r[3] - 1));
    const c = { h, d: Math.hypot(dx, dy), a: (h.r[2] - h.r[0]) * (h.r[3] - h.r[1]) };
    (c.d === 0 ? exact : near).push(c);
  }
  if (exact.length) return exact.sort((p, q) => p.a - q.a)[0].h;
  return near.sort((p, q) => (p.h.cls - q.h.cls) || (p.d - q.d) || (p.a - q.a))[0]?.h;
}
function standX(h) {
  const cx = (h.r[0] + h.r[2]) / 2, rr = h.reach ?? 14, reach = Array.isArray(rr) ? rr[S.x < cx ? 0 : 1] : rr;   // [from the left, from the right]
  if (Math.abs(S.x - cx) <= reach + 2) return S.x;
  return S.x < cx ? cx - reach : cx + reach;
}
// the camera leads a little in the direction Mercer faces, so Tetsu and the bucket clear the arrow buttons
const camFollow = () => Math.max(0, Math.min(CAMMAX, S.x - SW / 2 + 14 * S.face));

}
let marker = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();

  if (menuOpen) return;
  if (S.mode === 'cut') { skipWalk(); return; }
  if (S.mode !== 'taps') return;
  const r = cv.getBoundingClientRect();
  const sx = (e.clientX - r.left) / r.width * SW, sy = (e.clientY - r.top) / r.height * VH;
  const wx = sx + Math.round(S.cam), wy = sy + CAMY;
  marker = { x: wx, y: wy, t: 0 };
  const h = hit(sx, sy);
  if (h && h.layer === 'far') { S.tx = S.x; pending = null; S.face = sx >= S.x - S.cam ? 1 : -1; interact(h); }
  else if (h) { walkTo(standX(h), () => interact(h)); }

dlg.addEventListener('click', () => { if (cur) advance(); });
const releaseWalk = () => { keys.l = keys.r = false; document.querySelectorAll('.walk.on').forEach(b => b.classList.remove('on')); };
for (const [id, side] of [['#walk-l', 'l'], ['#walk-r', 'r']]) {
  const b = $(id);
  const on = e => { e.preventDefault(); e.stopPropagation(); if (!free()) return; keys[side] = true; pending = null; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = () => { keys[side] = false; b.classList.remove('on'); if (!keys.l && !keys.r && !pending && S.mode === 'taps') S.tx = S.x; };
  b.addEventListener('pointerdown', on);

addEventListener('keydown', e => {

  if (e.key === 'ArrowLeft' && free()) { keys.l = true; pending = null; e.preventDefault(); }
  else if (e.key === 'ArrowRight' && free()) { keys.r = true; pending = null; e.preventDefault(); }

// ------------------------------------------------------------ ambience
const rnd = (a, b) => a + Math.random() * (b - a);
const rainBack = [], rainFront = [], splashes = [], steam = [];
function initRain() {
  rainBack.length = rainFront.length = 0;
  const nb = reduceMotion ? 30 : 90, nf = reduceMotion ? 14 : 46;
  for (let i = 0; i < nb; i++) rainBack.push({ x: rnd(0, SW + 40), y: rnd(CAMY - VH, SH), v: rnd(230, 290), l: rnd(3, 6) | 0, floor: rnd(150, 180) });
  for (let i = 0; i < nf; i++) rainFront.push({ x: rnd(0, SW + 60), y: rnd(CAMY - VH, SH), v: rnd(360, 440), l: rnd(7, 11) | 0, floor: rnd(152, 182) });
}
initRain();
const amb = { t: 0, flickerAt: 3, flickerEnd: 0, offs: [], glint: null, glintAt: 1, scaleAt: 6, scaleOn: 0, coinAt: 3, coinOn: 0, cat: 0, catAt: 2, catEnd: 0, steamAt: 0, tetsu: 0 };
const BALLS = A.balls;
function ambience(dt, camDelta) {
  const t = (amb.t += dt);
  // neon buzz: bursts of off-frames
  if (!reduceMotion && t > amb.flickerAt) {
    amb.offs = []; let s = t;
    const n = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) { const d = rnd(.04, .12); amb.offs.push([s, s + d]); s += d + rnd(.03, .15); }
    amb.flickerAt = t + rnd(2.5, 7);
  }
  if (t > amb.glintAt) { const b = BALLS[Math.random() * BALLS.length | 0]; amb.glint = { x: b[0], y: b[1], until: t + .18 }; amb.glintAt = t + rnd(.4, 1.1); }
  if (t > amb.scaleAt) { amb.scaleOn = t + .18; amb.scaleAt = t + rnd(9, 15); }
  if (t > amb.coinAt) { amb.coinOn = t + .2; amb.coinAt = t + rnd(3, 6); }
  if (t > amb.catAt) { amb.cat = Math.random() < .5 ? 1 : 2; amb.catEnd = t + (amb.cat === 2 ? .16 : .6); amb.catAt = t + rnd(2, 5); }
  if (t > amb.catEnd) amb.cat = 0;
  amb.tetsu = Math.floor(t * 5) % 6;
  // steam from the vent
  if (t > amb.steamAt) { steam.push({ x: L.vent[0] + rnd(1, 11), y: L.vent[1] + 2, vx: rnd(-5, -1), vy: rnd(-12, -7), age: 0, life: rnd(1.6, 2.6) }); amb.steamAt = t + (reduceMotion ? .5 : .12); }
  for (let i = steam.length - 1; i >= 0; i--) { const p = steam[i]; p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.age > p.life) steam.splice(i, 1); }
  // rain
  const move = (arr, k, front) => arr.forEach(d => {
    d.y += d.v * dt; d.x -= d.v * dt * .22 + camDelta * k;
    if (d.y > d.floor) {
      if (front || Math.random() < .3) splashes.push({ x: d.x | 0, y: d.floor | 0, age: 0 });
      d.y = rnd(CAMY - 30, CAMY - 4); d.x = rnd(0, SW + 60); d.floor = rnd(front ? 152 : 150, front ? 182 : 180);
    }
    if (d.x < -10) d.x += SW + 60; if (d.x > SW + 60) d.x -= SW + 60;

  for (let i = splashes.length - 1; i >= 0; i--) { splashes[i].age += dt; splashes[i].x -= camDelta; if (splashes[i].age > .12) splashes.splice(i, 1); }
}
const neonOff = () => amb.offs.some(([a, b]) => amb.t >= a && amb.t < b);

// ------------------------------------------------------------ shots and blood
// Blood lands in the alley: droplets and wall spatter are stamped onto a decal layer that stays for the rest of the scene.
const fx = { mop: -9, flash: -9, muzzle: -9, shake: -9 };
const blood = [], drips = [], drops = [], smoke = [];
let pool = null;
const decal = document.createElement('canvas'); decal.width = WORLD; decal.height = SH;
const dctx = decal.getContext('2d');

function muzzle() {

function shoot(n) {

  const [hx, hy] = n === 1 ? [L.tetsu[0] - 1, L.tetsu[1] - 21] : [L.tetsu[0] + 4, L.tetsu[1] - 17];
