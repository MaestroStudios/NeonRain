  const cam = Math.round(S.cam);
  const sk = amb.t - fx.shake < .22 ? 1 - (amb.t - fx.shake) / .22 : 0;
  const shx = sk ? Math.round(rnd(-2.4, 2.4) * sk) : 0, shy = sk ? Math.round(rnd(-1.6, 1.6) * sk) : 0;
  ctx.clearRect(0, 0, SW, VH);
  ctx.save();
  ctx.translate(shx, -CAMY + shy);
  ctx.drawImage(img.sky, 0, 0);
  ctx.drawImage(img.far, -Math.round(cam * F.far), 0);
  for (const [lx, ly] of A.lights) if ((amb.t % 1.6) < .5) px(lx - Math.round(cam * F.far), ly, '#ff4a5a');
  for (const id in A.hiFar) drawGlow(img.hi_far, A.hiFar, id, Math.round(cam * F.far));
  ctx.drawImage(img.mid, -Math.round(cam * F.mid), 0);
  ctx.fillStyle = 'rgba(150,160,220,.28)';
  for (const d of rainBack) for (let k = 0; k < d.l; k++) ctx.fillRect(Math.round(d.x + k * .22), Math.round(d.y - k), 1, 1);
  ctx.drawImage(img.main, -cam, 0);
  if (neonOff()) ctx.drawImage(img.sign_off, A.signOffAt[0] - cam, A.signOffAt[1]);
  if (S.bucket === 'tipped') ctx.drawImage(img.bucket_gone, A.bucketGone[0] - cam, A.bucketGone[1]);
  for (const id in A.hiMain) if (!(id === 'bucket' && S.bucket === 'tipped')) drawGlow(img.hi_main, A.hiMain, id, cam);
  ctx.drawImage(decal, -cam, 0);
  // glints
  if (amb.glint && amb.t < amb.glint.until) px(amb.glint.x - cam, amb.glint.y, '#ffffff');
  if (amb.t < amb.coinOn) px(A.coin[0] - cam, A.coin[1], '#fff6c8');
  if (amb.t < amb.scaleOn) { const sx = L.scale[0] - cam, sy = L.scale[1]; px(sx, sy, '#ffffff'); ctx.fillStyle = 'rgba(230,240,255,.55)'; ctx.fillRect(sx - 1, sy, 1, 1); ctx.fillRect(sx + 1, sy, 1, 1); ctx.fillRect(sx, sy - 1, 1, 1); }
  // steam
  for (const p of steam) { const a = (1 - p.age / p.life) * .32, s = 1 + (p.age / p.life * 2 | 0); ctx.fillStyle = `rgba(176,176,226,${a})`; ctx.fillRect(Math.round(p.x - cam), Math.round(p.y), s, s); }
  // cat
  sprite(img.cat, amb.cat, 8, 10, L.cat[0] - cam, L.cat[1], false);
  if (glowAlpha('cat')) sprite(img.cat_hi, amb.cat, 8, 10, L.cat[0] - cam, L.cat[1], false, glowAlpha('cat'));
  // props against the wall, then Tetsu, then whatever lies in front of him
  if (S.mop === 'lean') ctx.drawImage(img.mop_lean, MOP_LEAN[0] - cam, MOP_LEAN[1]);
  if (S.bucket === 'tipped') ctx.drawImage(img.bucket_tipped, TIPPED[0] - cam, TIPPED[1]);
  drawTetsu(cam);
  drawMopOnFloor(cam);
  for (const p of blood) px(p.x - cam, p.y, p.c);
  for (const p of drops) px(p.x - cam, p.y, p.c);
  // Mercer + reflection
  const mf = mercerFrame();
  const mx = Math.round(S.x) - MSZ[0] / 2 - cam, my = FEET - MSZ[1];
  sprite(img.mercer, mf, MSZ[0], MSZ[1], mx, my, S.face < 0, .16, FEET);
  sprite(img.mercer, mf, MSZ[0], MSZ[1], mx, my, S.face < 0);
  // gun smoke and muzzle flash
  for (const p of smoke) { ctx.fillStyle = `rgba(190,190,210,${(1 - p.age / p.life) * .4})`; ctx.fillRect(Math.round(p.x - cam), Math.round(p.y), 1 + (p.age > .5 ? 1 : 0), 1); }
  if (amb.t - fx.muzzle < .07) {
    const [qx, qy] = muzzle(), x = qx - cam, d = S.face;
    const gr = ctx.createRadialGradient(x, qy, 0, x, qy, 26);
    gr.addColorStop(0, 'rgba(255,214,140,.55)'); gr.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gr; ctx.fillRect(x - 26, qy - 26, 52, 52); ctx.restore();
    ctx.fillStyle = '#ffd25a';
    for (let i = 1; i <= 6; i++) ctx.fillRect(x + d * i, qy, 1, 1);
    ctx.fillRect(x + d * 2, qy - 2, 1, 1); ctx.fillRect(x + d * 2, qy + 2, 1, 1); ctx.fillRect(x + d * 4, qy - 1, 1, 1); ctx.fillRect(x + d * 4, qy + 1, 1, 1);
    ctx.fillStyle = '#fffbe8'; ctx.fillRect(x - 1, qy - 1, 3, 3);
  }
  // tap marker: a small ring where the finger landed
  if (marker) {
    const k = marker.t / .35, r = 1 + k * 4; ctx.fillStyle = `rgba(214,255,150,${1 - k})`;
    const mx2 = Math.round(marker.x - cam), my2 = Math.round(marker.y);
    ctx.fillRect(mx2 - r, my2, 1, 1); ctx.fillRect(mx2 + r, my2, 1, 1); ctx.fillRect(mx2, my2 - r, 1, 1); ctx.fillRect(mx2, my2 + r, 1, 1);
  }
  ctx.drawImage(img.fg, -Math.round(cam * F.fg), 0);
  // front rain + splashes
  ctx.fillStyle = 'rgba(196,204,255,.5)';
  for (const d of rainFront) for (let k = 0; k < d.l; k++) ctx.fillRect(Math.round(d.x + k * .22), Math.round(d.y - k), 1, 1);
  ctx.fillStyle = 'rgba(200,206,255,.6)';
  for (const s of splashes) { ctx.fillRect(s.x - 1, s.y, 1, 1); ctx.fillRect(s.x + 1, s.y, 1, 1); if (s.age < .06) ctx.fillRect(s.x, s.y - 1, 1, 1); }
  if (showHot && S.mode === 'taps') {
    for (const h of HOTSPOTS) {
      const col = h.id === 'jacket' ? TIER_COLOR.subtle : (TIER_COLOR[ITEMS[h.id].tier] || '#888');
      const ox = h.layer === 'far' ? Math.round(cam * F.far) : cam, p = h.pad || 0;
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.setLineDash(h.cls ? [2, 2] : []);
      ctx.strokeRect(h.r[0] - p - ox + .5, h.r[1] - p + .5, h.r[2] - h.r[0] + 2 * p - 1, h.r[3] - h.r[1] + 2 * p - 1);
      ctx.setLineDash([]);
    }
  }
  ctx.restore();
  // the shot's white flash over the whole screen
  const fk = (amb.t - fx.flash) / .12;
  if (fk < 1) { ctx.fillStyle = `rgba(255,250,236,${(reduceMotion ? .2 : .5) * (1 - fk)})`; ctx.fillRect(0, 0, SW, VH); }
}

// ------------------------------------------------------------ loop
let last = 0;
function frame(ts) {
  if (!alive) return;
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  const fr = free();
  if (fr) {
    if (keys.l) S.tx = Math.max(12, S.x - 40);
    if (keys.r) S.tx = Math.min(WORLD - 12, S.x + 40);
  } else if (keys.l || keys.r) releaseWalk();
  $('#stage').classList.toggle('busy', !fr);
  const d = S.tx - S.x;
  if (Math.abs(d) > .5) {
    const step = Math.sign(d) * Math.min(Math.abs(d), walkSpeed * dt);
    S.x += step; S.dist += Math.abs(step); S.face = Math.sign(d);
  } else if (pending) {
    S.x = S.tx; const p = pending; pending = null; p();
  }
  const prev = S.cam;
  const target = S.camTarget ?? camFollow();
  S.cam += (target - S.cam) * Math.min(1, dt * 3.5);
  if (marker && (marker.t += dt) > .35) marker = null;
  ambience(dt, S.cam - prev);
  const due = waits.filter(w => amb.t >= w.t);
  if (due.length) { for (const w of due) waits.splice(waits.indexOf(w), 1); due.forEach(w => w.r()); }
  updateFx(dt);
  tickType(dt);
  draw();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------ designer sheet
function renderSheet() {
  if (!DEV) return;                                       // the player build has no designer sheet
  const rows = ['body', 'balls', 'bucket', 'vending', 'shirt', 'knife', 'pager', 'jacketCash', 'jacketPager', 'scale', 'camera', 'cat', ...Object.keys(SCENERY)];
  const rew = it => it.kind === 'clue' ? `${it.pts} clue${it.pts > 1 ? 's' : ''}` : it.kind === 'yen' ? yenFmt(it.pts * 10000) : '—';
  const extra = { knife: ' (+1 after the body)', pager: " (+1 after the victim's pager)", jacketPager: " (+1 after the cleaner's pager)", jacketCash: ' · fork' };
  $('#sheet-table').innerHTML = `<thead><tr><th>Object</th><th>Tier</th><th>Reward</th><th>Found</th></tr></thead><tbody>${rows.map(id => {
    const it = ITEMS[id];
    return `<tr><td>${esc(it.name)}</td><td><span class="tier ${it.tier}">${it.tier}</span></td><td class="num">${rew(it)}${extra[id] || ''}</td><td>${S.found[id] ? `<span class="found">✓${S.chained[id] ? ' chain' : ''}</span>` : ''}</td></tr>`;
  }).join('')}</tbody>`;
  const rr = r => r.clues ? `+${r.clues} clue${r.clues > 1 ? 's' : ''}` : r.yen ? yenFmt(r.yen * 10000) : `+${r.violence} violence (hidden)`;
  const crow = (when, set, chosen) => Object.entries(set).map(([k, o]) =>
    `<tr><td>${when}</td><td>${o.name}</td><td>${esc(o.label)}</td><td class="num">${rr(o.r)}${o.note ? ` · ${esc(o.note)}` : ''}</td><td>${chosen === k ? '<span class="found">✓</span>' : ''}</td></tr>`).join('');
  $('#choice-table').innerHTML = `<thead><tr><th>Moment</th><th>Side</th><th>Button</th><th>Reward</th><th>Chosen</th></tr></thead><tbody>${crow('Opening', OPENING, S.opening)}${crow('Finale', FINAL, S.final)}</tbody>`;
}

// ------------------------------------------------------------ boot
function restart() {
  waits.length = 0;                       // the old script never resumes
  queue = []; cur = null; onDone = null; menuOpen = false; badge = null; pending = null; autoWalk = false; walkSpeed = SPEED; marker = null;
  S = fresh();                            // same scene 1 as before
  for (const id in glow) delete glow[id];
  clearFx(); releaseWalk();
  $('#endcard').hidden = true; $('#endcard').innerHTML = ''; dlg.hidden = false;
  idle(); hud(); opening();
}
$('#restart')?.addEventListener('click', restart);
$('#opt-hotspots')?.addEventListener('change', e => { showHot = e.target.checked; });
$('#opt-glow-finds')?.addEventListener('change', e => { glowFinds = e.target.checked; for (const id in glow) if (glowFinds && !FIND_IDS.has(id)) delete glow[id]; });
$('#opt-glow-stay')?.addEventListener('change', e => { glowStay = e.target.checked; });

if (DEV) window.__t = { scene: 2, get S() { return S; }, get cur() { return cur; }, get menuOpen() { return menuOpen; }, advance, skipWalk, tap: id => interact(HOTSPOTS.find(h => h.id === id)) };   // handle for the Playwright tests
showHot = !!$('#opt-hotspots')?.checked;
glowFinds = !!$('#opt-glow-finds')?.checked; glowStay = !!$('#opt-glow-stay')?.checked;
hud();
load().then(() => { if (!alive) return; opening(); window.requestAnimationFrame(t => { last = t; frame(t); }); });
return () => { alive = false; waits.length = 0; offs.forEach(f => f()); };
}

// ================================================================ Scene 3, not made yet: stay tuned
// An empty screen with the rain still falling, a line and a way back to the title.
function scene3(api) {
let alive = true;
const cv = document.querySelector('#screen'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const rain = Array.from({ length: reduceMotion ? 0 : 60 }, () => ({ x: rnd(0, W + 30), y: rnd(-10, H), v: rnd(90, 140) }));
const btn = document.querySelector('#to-title');
btn.addEventListener('click', () => { if (alive) api.newGame(); });
btn.focus({ preventScroll: true });
let last = 0;
function loop(ts) {
  if (!alive) return;
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  ctx.fillStyle = '#07060f'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(170, 176, 230, .25)';
  for (const d of rain) {
    d.y += d.v * dt; d.x -= d.v * dt * .45;
    if (d.y > H) { d.y = rnd(-12, -2); d.x = rnd(0, W + 40); }
    for (let k = 0; k < 4; k++) ctx.fillRect(Math.round(d.x - k * .45), Math.round(d.y - k), 1, 1);
  }
  window.requestAnimationFrame(loop);
}
window.requestAnimationFrame(t => { last = t; loop(t); });
if (DEV) window.__t = { scene: 3 };
return () => { alive = false; };
}


// ================================================================ the joint game: title, scene 1, a score card, scene 2, a score card, scene 3 (stay tuned)
(function () {
  const app = document.getElementById('app');
  let stop = null;
  const STORE = 'neonrain.records.v2';                 // high score and endings, kept in this browser (v2: the beta's v1 counts are dropped)
  const records = () => { try { const r = JSON.parse(localStorage.getItem(STORE) || '{}'); return { best: r.best | 0, endings: Array.isArray(r.endings) ? r.endings : [] }; } catch (e) { return { best: 0, endings: [] }; } };
  const save = r => { try { localStorage.setItem(STORE, JSON.stringify(r)); } catch (e) {} };
  const api = {
    start: () => mount(1), next: carry => mount(2, carry), later: () => mount(3), newGame: () => mount(0),
    records, resetRecords: () => save({ best: 0, endings: [] }),
    finish: ({ score, ending }) => {                    // for the end of the game (not called yet): keep the best score and the endings seen
      const r = records(), isNew = score > r.best;
      if (isNew) r.best = score;
      if (ending && !r.endings.includes(ending)) r.endings.push(ending);
      save(r); return { best: r.best, isNew, endings: r.endings.length };
    },
  };
  function mount(n, carry) {
    if (stop) stop();
    document.documentElement.dataset.scene = String(n);
    app.innerHTML = TPL[n];
    window.scrollTo(0, 0);
    stop = n === 0 ? title(A0, api) : n === 1 ? scene1(A1, api) : n === 2 ? scene2(A2, api, carry || { clues: 0, yen: 0, flags: {} }) : scene3(api);
  }
  mount(0);
})();
</script>
